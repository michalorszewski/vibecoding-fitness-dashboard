name: Publish Forma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p "$RUNNER_TEMP/forma/css" "$RUNNER_TEMP/forma/js"
          cp fitness-dashboard/index.html fitness-dashboard/.nojekyll "$RUNNER_TEMP/forma/"
          cp fitness-dashboard/css/*.css "$RUNNER_TEMP/forma/css/"
          cp fitness-dashboard/js/app.js fitness-dashboard/js/storage.js "$RUNNER_TEMP/forma/js/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/forma
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4